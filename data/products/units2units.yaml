# Facts rendered by layouts/_default/product.html. The version, APK file name
# and checksum come from data/apk_checksums.json (generated from the APK), not
# from here — never duplicate them by hand.
name: Units2Units
tagline: The platinum grade, comprehensive, elegant, and powerful multi-unit conversion suite.
category: Utilities / Productivity
license: Free (Optional Pro Upgrade)
# Machine-readable platforms. "android" controls whether the APK download
# button, the integrity block and the install guide render at all; "ios" and any
# future desktop platforms are informational and drive the Quick Info row.
platforms:
  - android
  - ios
logo: /units2units/images/logo_200_square.png
logoAlt: Units2Units icon
store:
  label: Apple App Store (iOS)
  url: https://apps.apple.com/ca/app/units2units/id6778024693
badges:
  - label: Languages
    value: 29 Languages (Multilingual)
  - label: Platform Support
    value: Android & iOS
  - label: Offline Access
    value: 100% Offline Functional
  - label: Privacy
    value: No Ads / No Trackers / No Login
# Key-change notice (procedure: docs/KEY-CHANGE.md). Uncomment when the APK is
# re-signed with a new certificate; delete it again after one release cycle.
# The fingerprint itself is already shown by the "Verify this APK" block, so the
# text only has to explain the one-time uninstall and its data loss.
#
notice: |
  **New signing key.** This build is signed with a new certificate, shown under
  "Verify this APK" above. Android cannot update an existing install in place
  when the signing key changes, so uninstall the old version once and then
  install this build. Anything stored inside the old app is removed by that
  uninstall, so export what you need first.
