baseURL: https://gnitoapp.com
title: GnitoApp.com

# cSpell:ignore goldmark github hugo readingtime docsy subdir lastmod pygments linenos catmullrom norsk gu

# Language settings
contentDir: content/en
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
# Useful when translating.
enableMissingTranslationPlaceholders: true

enableRobotsTXT: true

# Will give values to .Lastmod etc.
enableGitInfo: false

# The site has no tagging/blog structure, so Docsy's empty /tags and /categories
# pages are not published at all.
disableKinds: [taxonomy]

# Highlighting config
pygmentsCodeFences: true
pygmentsUseClasses: false
# Use the new Chroma Go highlighter in Hugo.
pygmentsUseClassic: false
# pygmentsOptions: "linenos=table"
# See https://help.farbox.com/pygments.html
pygmentsStyle: tango

# Image processing configuration.
imaging:
  resampleFilter: CatmullRom
  anchor: Smart
  # Hugo 0.163 deprecated the single `quality` key in favour of per-format keys.
  jpeg:
    quality: 75
  webp:
    quality: 75
  avif:
    quality: 75

# Language configuration
languages:
  en:
    label: English
    title: GnitoApp.com
    params:
      description: We develop applications for the web, Windows, MacOS, Linux, iOS, and Android.
  # cSpell:disable
  # "no":
  #   languageName: Norsk
  #   contentDir: content/no
  #   title: Gulldoks
  #   params:
  #     description: Docsy er operativsystem for skyen
  #     time_format_default: 02.01.2006
  #     time_format_blog: 02.01.2006
  # fa:
  #   languageDirection: rtl
  #   languageName: "فارسی (Persian)"
  #   contentDir: content/fa
  #   title: "اسناد گلدی"
  #   params:
  #     description: "یک نمونه برای پوسته داکسی"
  #     time_format_default: 2006.01.02
  #     time_format_blog: 2006.01.02
  # cSpell:enable

markup:
  goldmark:
    parser:
      attribute:
        block: true
    renderer:
      unsafe: true
  highlight:
    # See a complete list of available styles at https://xyproto.github.io/splash/docs/all.html
    style: tango
    # Uncomment if you want your chosen highlight style used for code blocks without a specified language
    # guessSyntax: true

# Main navigation. The three app links are grouped under one dropdown labelled
# "Apps" (rendered by the local navbar override); the remaining pages are
# ordinary top-level links.
menu:
  main:
    - name: Apps
      identifier: apps
      weight: 1

# Everything below this are Site Params

params:
  privacy_policy: /privacy

  # First one is picked as the Twitter card image if not set on page.
  # Fallback social card for pages without their own `images:` front matter.
  images: ["/og/gnitoapp-com.png"]

  # Repository configuration (URLs for in-page links to opening issues and suggesting changes)
  github_repo: https://github.com/gnitoapp-com/gnitoapp-com.github.io

  # An optional link to a related project repo. For example, the sibling repository where your product code lives.
  github_project_repo: https://github.com/gnitoapp-com/gnitoapp-com.github.io

  # Specify a value here if your content directory is not in your repo's root directory
  # github_subdir: ""

  # Uncomment this if your GitHub repo does not have "main" as the default branch,
  # or specify a new value if you want to reference another branch in your GitHub links
  github_branch: main

  # Google Custom Search Engine ID. Remove or comment out to disable search.
  # gcs_engine_id: d72aa9b2712488cc3

  # Enable Lunr.js offline search
  offlineSearch: false

  copyright:
    authors: GnitoApp.com | All Rights Reserved |
    from_year: 2025

  # User interface configuration
  ui:
    # Set to true to disable breadcrumb navigation.
    breadcrumb_disable: false
    # Set to false if you don't want to display a logo (/assets/icons/logo.svg) in the top navbar
    navbar_logo: true
    # Set to true if you don't want the top navbar to be translucent when over a `block/cover`, like on the homepage.
    navbar_translucent_over_cover_disable: false
    # Enable to show the side bar menu in its compact state.
    sidebar_menu_compact: false
    # Set to true to hide the sidebar search box (the top nav search box will still be displayed if search is enabled)
    sidebar_search_disable: false

    # Adds a H2 section titled "Feedback" to the bottom of each doc. The responses are sent to Google Analytics as events.
    # This feature depends on [services.googleAnalytics] and will be disabled if "services.googleAnalytics.id" is not set.
    # If you want this feature, but occasionally need to remove the "Feedback" section from a single page,


  links:
    # End user relevant links. These will show up on left side of footer and in the community page if you have one.
    user:
      - name: Bluesky
        url: https://bsky.app/profile/gnitoapp.com
        icon: fa-brands fa-bluesky
        desc: Follow us on Bluesky to get the latest news!
    # Developer relevant links. These will show up on right side of footer and in the community page if you have one.
    developer:
      - name: GitHub
        url: https://github.com/gnitoapp-com/gnitoapp-com.github.io
        icon: fab fa-github
        desc: Development takes place here!

module:
  hugoVersion:
    extended: true
    # Docsy 0.16 raised its own minimum to 0.160.1; keep this in step with the
    # hugo-extended pin in package.json.
    min: 0.160.1
  imports:
    # Docsy moved to the docsy GitHub organisation at v0.18 and its theme now
    # lives in the theme/ subdirectory.
    - path: github.com/docsy/docsy/theme
      disable: false
