# Spell-check settings. Run with: npm run spell
# https://cspell.org/configuration/
version: '0.2'
caseSensitive: false
ignorePaths:
  - public/**
  - resources/**
  - node_modules/**
  - packages/**
  - static/**
  - package-lock.json
  - LICENSE
words:
  # Company and products
  - Gnito
  - GnitoApp
  - gnitoapp
  - Units2Units
  - Romanitaire
  - romanitaire
  - Ledgerik
  - ledgerik
  - forceworkouthelper
  - bluesky
  # Training timer vocabulary
  - AMRAP
  - EMOM
  - TABATA
  - HIIT
  - Ferox
  - Constantia
  - Undos
  # Android / download vocabulary
  - APK
  - apksigner
  - keytool
  - sha256sum
  - SHA256SUMS
  - Termux
  - sideloading
  - sideload
  - macOS
  # Named in legal text
  - Elmwood
  - PIPEDA
  - canadainc
  - timeframe
  - Hyperfocal
  - TDEE
  - Motorsport
  - licence
  - Licence
  - acw
  - acwz
  # Desktop distribution vocabulary
  - AppImage
  - appimage
  - appimagetool
  - libfuse2
  - libfuse2t64
  - pacman
  - zypper
  - openSUSE
  - AppImages
  # Canadian spellings used in prose (the app's own labels keep US spelling)
  - colour
  - colours
  - organised
  - x86_64
  - msix
  - notarization
  - notarized
  # Theme / tooling
  - Docsy
  - Hugo
  - hugo
