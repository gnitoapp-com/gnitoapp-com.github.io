# Build and deploy the gnitoapp.com Hugo site to GitHub Pages.
#
# The Hugo version is NOT set here: it comes from the `hugo-extended`
# devDependency in package.json, resolved through the committed lockfile, so
# `npm run build:production` is the same recipe locally and in CI. Bump Hugo
# with `npm run update:hugo`, never by editing this file.
name: Deploy Hugo site to Pages

on:
  # Only the default branch publishes. Pushes to other branches trigger nothing.
  push:
    branches:
      - main

  # Manual runs are allowed from any ref; the deploy job is gated to `main`,
  # so a dispatch from a branch builds (validation) without publishing.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_ENVIRONMENT: production
  TZ: UTC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # No history needed: enableGitInfo is false, and the repo carries
          # large binaries in its history.
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Docsy is a Hugo module: it is fetched with Go (preinstalled on the
      # runner) into HUGO_CACHEDIR, which is what this cache covers.
      - name: Cache Hugo modules
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            hugo-${{ runner.os }}-

      - name: Install Node.js dependencies
        run: npm ci

      - name: Spell check
        run: npm run spell

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Toolchain versions
        run: |
          node --version
          npm --version
          go version
          ./node_modules/.bin/hugo version

      # Fails if a published checksum, SHA256SUMS file, version.json, APK file
      # name or landing-page download link disagrees with the APK itself.
      - name: Verify APK integrity data
        run: ./scripts/apk-checksums.sh --check

      - name: Build with Hugo
        env:
          # Must match the cache path above. The runner context is only
          # available from step level, not workflow level.
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: npm run build:production

      # The APK link, version and checksum now come from templates, so they are
      # verified on the built pages rather than in the Markdown source.
      - name: Verify rendered APK pages
        run: ./scripts/apk-checksums.sh --rendered public

      # Internal links and anchors. The build already ran this via its
      # postbuild:production hook; running it explicitly keeps the gate visible
      # in the log even if that hook is ever changed.
      - name: Check links
        run: npm run check:links

      - name: Validate HTML
        run: npm run lint:html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  # Deployment job
  # Only `main` may publish. Branch pushes never reach this workflow, but a manual
  # workflow_dispatch can select any ref: gating the deploy here keeps that path from
  # publishing while still letting a branch run the build job for validation.
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # A deploy is only successful if the site actually serves what we built.
      - name: Smoke test the deployed site
        run: ./scripts/smoke-test.sh https://gnitoapp.com
